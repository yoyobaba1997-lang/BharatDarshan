name: BharatDarshan Catalogue Refresh

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      provider_enrichment:
        description: "Include bounded TMDB watch-provider enrichment"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      provider_limit:
        description: "Maximum titles for provider enrichment (1–500)"
        required: false
        default: "100"
      commit_snapshot:
        description: "Commit the audited catalogue snapshot to main (manual runs only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate TMDB credential is configured
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret TMDB_READ_ACCESS_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Ingest metadata snapshot
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          INGEST_PAGES: "2"
          INGEST_TYPES: "movie,tv"
          INGEST_MODES: "trending,popular,top_rated,indian_languages"
          INGEST_LANGUAGES: "hi,ta,te,ml,kn,bn,mr,gu,pa,or,as,ur"
          INGEST_PROVIDER_AVAILABILITY: ${{ github.event.inputs.provider_enrichment == 'true' && '1' || '0' }}
          INGEST_PROVIDER_LIMIT: ${{ github.event.inputs.provider_limit || '100' }}
          INGEST_PROVIDER_REGIONS: "IN,US,GB"
          INGEST_REPLACE: "1"
        run: npm run ingest
      - name: Audit generated catalogue
        run: npm run audit --workspace @bharatdarshan/api
      - name: Commit audited snapshot (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit_snapshot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/catalog/src/ingested-catalog.json
          if git diff --cached --quiet; then
            echo "Catalogue snapshot is unchanged; no commit created."
          else
            git commit -m "chore(catalog): refresh audited TMDB snapshot"
            git push
          fi
      - name: Upload catalogue snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bharatdarshan-catalogue-${{ github.run_id }}
          path: packages/catalog/src/ingested-catalog.json
          retention-days: 30
