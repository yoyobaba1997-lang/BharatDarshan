name: BharatDarshan CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t bharatdarshan-api:ci .
      - name: Build web container
        run: docker build -f apps/web/Dockerfile -t bharatdarshan-web:ci .
